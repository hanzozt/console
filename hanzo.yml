# hanzoai/zt-console — the Angular console for Hanzo ZT. One tree, two images:
#
#   zt-console-assets — the SPA alone (`ng build zt-console`). The ZT controller
#     serves it mounted at /zac, and Angular resolves its runtime paths against
#     the base href baked in at build time, so BASE_HREF must match that mount.
#   zt-console — the standalone Node server (`ng build zt-console-node` plus
#     server.js), which serves the same console on its own ports.
#
# The Angular compile runs INSIDE both Dockerfiles, so building them is the
# gate: a type error, an unresolvable dependency or a broken `ng build` fails
# here and nothing ships. The repo's own `npm test` is `ng test`, a karma suite
# that needs a headless browser this runner image does not carry.
images:
  - name: zt-console-assets
    context: .
    dockerfile: docker-images/zt-console-assets/Dockerfile
    repo: ghcr.io/hanzoai/zt-console-assets
    args:
      NODE_VERSION: "20"
      BASE_HREF: /zac/
  - name: zt-console
    context: .
    dockerfile: docker-images/zac/Dockerfile
    repo: ghcr.io/hanzoai/zt-console
